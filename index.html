<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>My Songless</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><span class="eyebrow">MY</span><h1>Songless</h1></div>
      <button id="spotifyBtn" class="btn spotify">Se connecter à Spotify</button>
    </header>

    <section id="setup" class="card setup">
      <div class="section-head"><div><p class="eyebrow">01 · PLAYLIST</p><h2>Choisis ta playlist</h2></div><span id="status" class="status">Non connecté</span></div>
      <div id="playlistList" class="playlist-list"><div class="empty">Connecte Spotify pour charger tes playlists.</div></div>
      <button id="startBtn" class="btn primary" disabled>Commencer le blind test</button>
    </section>

    <section id="game" class="game hidden">
      <div class="game-head">
        <div><p id="roundLabel" class="eyebrow">ROUND 1</p><h2 id="playlistTitle">—</h2></div>
        <button id="quitBtn" class="btn ghost">Quitter</button>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="game-card card">
        <div id="timer" class="timer">0.1 s</div>
        <div class="disc"><div class="disc-hole"></div></div>
        <p id="hint" class="hint">Écoute l'extrait.</p>
        <div class="controls">
          <button id="playBtn" class="btn primary big">▶ Écouter</button>
          <button id="skipBtn" class="btn">Je passe</button>
        </div>
        <div id="answerBox" class="answer-box hidden"></div>
        <div class="answer-row">
          <input id="guess" type="text" placeholder="Titre ou artiste…" autocomplete="off">
          <button id="answerBtn" class="btn">Valider</button>
        </div>
      </div>
    </section>

    <section id="result" class="card result hidden">
      <p class="eyebrow">FIN DU BLIND TEST</p>
      <h2 id="score">0 / 0</h2>
      <p id="resultText"></p>
      <button id="againBtn" class="btn primary">Rejouer</button>
    </section>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
